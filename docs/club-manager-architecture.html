<title>Club Manager Architecture</title>
<style>
  :root {
    --bg: #EAEEF9;
    --page-edge: #DCE3F5;
    --surface: #FFFFFF;
    --border: #C7D0E8;
    --border-strong: #A9B6DC;
    --text: #1B2440;
    --text-muted: #5C6690;
    --hub: #EEF1FB;
    --hub-border: #7C89C4;
    --flow: #D6247E;
    --flow-soft: #F9D9E9;
    --db: #E4ECFB;
    --db-border: #6C86C9;
    --route: #E9F5EE;
    --route-border: #3F9463;
    --accent: #1B2A6B;
    --shadow: 0 2px 4px rgba(27, 36, 64, .05), 0 14px 32px rgba(27, 36, 64, .07);
    --font-heading: 'Oswald', sans-serif;
    --font-body: 'Inter', system-ui, -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161A2C; --page-edge: #10131F; --surface: #1E2340;
      --border: #33395C; --border-strong: #454C78;
      --text: #E7EAF7; --text-muted: #9AA1C7;
      --hub: #232951; --hub-border: #6C79C4;
      --flow: #F272AE; --flow-soft: rgba(242,114,174,.14);
      --db: #202650; --db-border: #7E97E6;
      --route: #1C3324; --route-border: #4CAF77;
      --accent: #AEB8F5;
      --shadow: 0 2px 4px rgba(0,0,0,.35), 0 16px 34px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"] {
    --bg: #161A2C; --page-edge: #10131F; --surface: #1E2340;
    --border: #33395C; --border-strong: #454C78;
    --text: #E7EAF7; --text-muted: #9AA1C7;
    --hub: #232951; --hub-border: #6C79C4;
    --flow: #F272AE; --flow-soft: rgba(242,114,174,.14);
    --db: #202650; --db-border: #7E97E6;
    --route: #1C3324; --route-border: #4CAF77;
    --accent: #AEB8F5;
    --shadow: 0 2px 4px rgba(0,0,0,.35), 0 16px 34px rgba(0,0,0,.45);
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page-edge); color: var(--text); font-family: var(--font-body); line-height: 1.5; }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 32px 20px 80px; }

  header.top { margin-bottom: 22px; }
  .eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); }
  h1 { font-family: var(--font-heading); font-size: 27px; font-weight: 700; letter-spacing: .01em; margin: 4px 0 8px; text-wrap: balance; }
  .lede { color: var(--text-muted); font-size: 13.5px; max-width: 72ch; }

  figure { margin: 0; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 20px 20px 14px; }
  figure svg { width: 100%; height: auto; display: block; }
  figcaption { font-size: 12.5px; color: var(--text-muted); margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); max-width: 90ch; }
  figcaption b { color: var(--text); font-weight: 600; }

  text { font-family: var(--font-body); fill: currentColor; }
  .mono { font-family: var(--font-mono); }
  .heading { font-family: var(--font-heading); font-weight: 600; letter-spacing: .015em; }
  .group-label { font-family: var(--font-heading); font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
  .flow-label { font-family: var(--font-mono); font-size: 10px; fill: var(--flow); font-weight: 600; }
  .pill-text { font-family: var(--font-mono); font-size: 10.5px; }
  .note { font-size: 10px; fill: var(--text-muted); }

  footer { text-align: center; font-size: 11.5px; color: var(--text-muted); margin-top: 16px; font-family: var(--font-mono); }
</style>
